# یک‌بار اجرا شود. کلید امضا می‌سازد و در فایل Artifact قرار می‌دهد.
# بعد از دانلود، محتوای فایل base64.txt را در Secret با نام BNA_KEYSTORE_B64 بگذارید،
# و رمز و نام کلید را هم در Secretهای BNA_KS_PASS، BNA_KEY_ALIAS و BNA_KEY_PASS ذخیره کنید.
# پس از ذخیره‌ی Secretها، این Artifact را حذف کنید و این workflow را دیگر اجرا نکنید.
name: Make signing keystore
on:
  workflow_dispatch:
    inputs:
      password:
        description: "رمز کلید (حداقل ۶ نویسه؛ همان را در Secret بگذارید)"
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: ساخت کلید
        env:
          PW: ${{ github.event.inputs.password }}
        run: |
          keytool -genkeypair -v -keystore bna.jks -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 10000 -alias bna -storepass "$PW" -keypass "$PW" \
            -dname "CN=Hamid reza rahimi, O=BNA, C=IR"
          base64 -w0 bna.jks > base64.txt
          echo "alias: bna" > info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bna-keystore
          path: |
            base64.txt
            info.txt
          retention-days: 1
